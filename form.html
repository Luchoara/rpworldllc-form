<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form with Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        #formContainer {
            display: none;
        }
        .form-div {
            background-color: #e3f2fd;
            padding: 20px;
            border-radius: 8px;
        }
        h2 {
            font-size: 1.5rem;
            color: #333;
            text-align: center;
        }
        .separator {
            height: 5px;
            background-color: red;
            margin: 15px 0;
        }
        .form-group {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .form-group label {
            width: 100%;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #e0f7fa;
        }
        .btn-submit {
            background-color: #4CAF50;
            color: white;
            width: 100%;
            font-weight: bold;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
        .form-column {
            width: 48%;
            margin-bottom: 15px;
        }
        #messageBox {
            display: none; /* Ocultar inicialmente el mensaje */
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container mt-5" id="formContainer">
        <div class="form-div">
            <h2>Nombre de la Campaña</h2>
            <div class="separator"></div>
            <form id="formData" method="post">
                <div class="form-group">
                    <div class="form-column">
                        <label for="publisher_id">ID del Publicador:</label>
                        <input type="text" id="publisher_id" name="publisher_id" required />
                    </div>
                    <div class="form-column">
                        <label for="caller_number">Número de Llamada:</label>
                        <input type="text" id="caller_number" name="caller_number" autocomplete="tel" required />
                    </div>
                    <div class="form-column">
                        <label for="first_name">Nombre:</label>
                        <input type="text" id="first_name" name="first_name" autocomplete="given-name" required />
                    </div>
                    <div class="form-column">
                        <label for="last_name">Apellido:</label>
                        <input type="text" id="last_name" name="last_name" autocomplete="family-name" required />
                    </div>
                    <div class="form-column">
                        <label for="caller_zip">Código Postal:</label>
                        <input type="text" id="caller_zip" name="caller_zip" required />
                    </div>
                    <div class="form-column">
                        <label for="caller_state">Estado:</label>
                        <input type="text" id="caller_state" name="caller_state" required />
                    </div>
                    <div class="form-column">
                        <label for="trusted_form_cert_url">Certificado de Formulario Confiable URL:</label>
                        <input type="text" id="trusted_form_cert_url" name="trusted_form_cert_url" required />
                    </div>
                </div>
                <button type="submit" class="btn btn-submit btn-success">Enviar</button>
            </form>
        </div>
    </div>

    <div id="messageBox" class="alert" role="alert">
        <p id="messageText" style="margin: 0"></p>
    </div>

    <div id="welcome-message" style="display:none;"></div>

    <script>
        $(document).ready(function () {
            const companyName = "803 ACA WT - TEST";

            function showWelcomeMessage(companyName) {
                const welcomeMessageDiv = document.getElementById('welcome-message');
                welcomeMessageDiv.textContent = `Welcome, ${companyName}`;
                welcomeMessageDiv.style.display = 'block';
            }

            function showGreetingAlert() {
                Swal.fire({
                    title: `Welcome, ${companyName}`,
                    text: "We're glad to have you here!",
                    icon: 'success',
                    confirmButtonText: 'Proceed to Login',
                    timer: 3000,
                    timerProgressBar: true,
                }).then(() => {
                    showLoginPrompt();
                });
            }

            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(String(email).toLowerCase());
            }

            function validatePassword(password) {
                const re = /^(?=.*[A-Z])(?=.*[0-9]).{8,}$/;
                return re.test(String(password));
            }

            function validateURL(url) {
                const urlPattern = /^(https?:\/\/)?([\da-z.-]+)\.([a-z.]{2,6})([/\w .-]*)*\/?$/;
                return urlPattern.test(url);
            }

            function showLoginPrompt() {
                Swal.fire({
                    title: 'Login Required',
                    html:
                        '<input type="email" id="username" class="swal2-input" placeholder="Email">' +
                        '<input type="password" id="password" class="swal2-input" placeholder="Password">',
                    showCancelButton: false,
                    confirmButtonText: 'Login',
                    focusConfirm: false,
                    preConfirm: () => {
                        const username = Swal.getPopup().querySelector('#username').value;
                        const password = Swal.getPopup().querySelector('#password').value;

                        if (!validateEmail(username)) {
                            Swal.showValidationMessage(`Please enter a valid email.`);
                        }
                        if (!validatePassword(password)) {
                            Swal.showValidationMessage(
                                `Password must be at least 8 characters long and contain at least one uppercase letter and one number.`
                            );
                        }

                        return { username: username, password: password };
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        if (result.value.username === "prueba@gmail.com" && result.value.password === "A1234567") {
                            $('#formContainer').show();
                            showWelcomeMessage(companyName);
                        } else {
                            showErrorMessage("Invalid username or password.");
                        }
                    }
                });
            }

            function showErrorMessage(message) {
                $('#messageText').text(message);
                $('#messageBox').removeClass().addClass('alert alert-danger').fadeIn().delay(2000).fadeOut();
            }

            $('#formData').on('submit', function (event) {
                event.preventDefault();

                const formData = {
                    publisher_id: $('#publisher_id').val(),
                    caller_number: $('#caller_number').val(),
                    first_name: $('#first_name').val(),
                    last_name: $('#last_name').val(),
                    caller_zip: $('#caller_zip').val(),
                    caller_state: $('#caller_state').val(),
                    trusted_form_cert_url: $('#trusted_form_cert_url').val(),
                };

                $.ajax({
    url: 'http://127.0.0.1:5500/form.html',
    method: 'GET', // Cambia a POST cuando se resuelva el 405
    data: formData, // Envía los datos sin JSON.stringify
    success: function (response) {
        Swal.fire({
            icon: 'success',
            title: 'Success!',
            text: response.message,
            confirmButtonText: 'Close'
        });
        $('#formData')[0].reset();
    },
    error: function (xhr) {
        const errorMessage = xhr.responseJSON ? xhr.responseJSON.message : 'An error occurred';
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: errorMessage,
            confirmButtonText: 'Close'
        });
    }
});

            });

            showGreetingAlert();
        });
    </script>
</body>
</html>
