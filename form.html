<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Tech Vision - 809Marmot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <style>
        #welcome-message {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            z-index: 1000;
        }
        
        #formContainer {
            display: none; /* Ocultar el formulario inicialmente */
        }

        /* Estilos personalizados para el mensaje de error */
        #messageBox {
            display: none;
            padding: 20px;
            border-radius: 5px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }

        /* Mantener los estilos existentes */
        .form-container {
            margin-top: 20px;
        }

        #sendingMessage {
            display: none;
            color: blue;
        }
    </style>
</head>

<body>
    <div id="welcome-message" style="display: none;"></div>

    <div class="container mt-5" id="formContainer">
        <div class="form-div">
            <form id="formData" method="post" class="border p-4 bg-light">
                <h2 class="text-center">Nexus Tech Vision</h2>
                <h1 class="text-center">809Marmot</h1>

                <input type="hidden" id="publisher_id" name="publisher_id" value="7f948b38" />
                <input type="hidden" id="key" name="key" value="136b19e3-3912-476a-8b5b-9a8de3fee354" />

                <!-- Campos del formulario existentes -->
                <div class="form-group">
                    <label for="caller_number">Caller Number</label>
                    <input type="text" class="form-control" id="caller_number" name="caller_number" placeholder="Phone Number" />
                </div>

                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" class="form-control" id="first_name" name="first_name" placeholder="First Name" />
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Last Name" />
                </div>

                <div class="form-group">
                    <label for="caller_zip">Caller ZIP</label>
                    <input type="text" class="form-control" id="caller_zip" name="caller_zip" placeholder="ZIP" />
                </div>

                <div class="form-group">
                    <label for="caller_state">Caller State</label>
                    <select id="caller_state" name="caller_state" class="form-control">
                        <option value="">Select a State</option>
                        <option value="AK">AK</option>
                        <option value="AL">AL</option>
                        <!-- Agrega más opciones de estado aquí -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="jornaya_leadid">Jornaya Lead ID</label>
                    <input type="text" class="form-control" id="jornaya_leadid" name="jornaya_leadid" placeholder="Insert the Lead ID" />
                </div>

                <button type="submit" class="btn btn-primary mt-3">Submit</button>
                <p id="sendingMessage">Sending data, please wait...</p>
            </form>
        </div>
    </div>

    <div id="messageBox">
        <p id="messageText" style="margin: 0"></p>
    </div>

    <script>
        $(document).ready(function () {
            const companyName = "809Marmot";

            // SweetAlert para saludo y login
            function showGreetingAlert() {
                Swal.fire({
                    title: `Welcome, ${companyName}`,
                    text: "Please log in to continue.",
                    icon: 'success',
                    confirmButtonText: 'Proceed to Login',
                    timer: 3000,
                    timerProgressBar: true,
                }).then(() => {
                    showLoginPrompt();
                });
            }

            // SweetAlert para el prompt de login
            function showLoginPrompt() {
                Swal.fire({
                    title: 'Login Required',
                    html: '<input type="email" id="username" class="swal2-input" placeholder="Email">' +
                          '<input type="password" id="password" class="swal2-input" placeholder="Password">',
                    showCancelButton: false,
                    confirmButtonText: 'Login',
                    preConfirm: () => {
                        const username = Swal.getPopup().querySelector('#username').value;
                        const password = Swal.getPopup().querySelector('#password').value;

                        if (!username || !password) {
                            Swal.showValidationMessage(`Please enter both email and password.`);
                        }

                        return { username: username, password: password };
                    }
                }).then((result) => {
                    if (result.isConfirmed && result.value.username === "prueba@gmail.com" && result.value.password === "A1234567") {
                        $('#formContainer').show(); // Mostrar el formulario
                        $('#welcome-message').text(`Welcome, ${companyName}`).show();
                    } else {
                        Swal.fire('Error', 'Invalid credentials', 'error');
                        showLoginPrompt();
                    }
                });
            }

            // Mostrar alerta de saludo al cargar la página
            showGreetingAlert();

            // Manejar el envío del formulario
            $('#formData').on('submit', async function (event) {
                event.preventDefault();

                const formData = new FormData(this);
                const data = Object.fromEntries(formData.entries());

                try {
                    $('#sendingMessage').show();
                    const response = await fetch("https://rpworldllc.com/test/form", { // Aquí está la modificación
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(data),
                    });

                    $('#sendingMessage').hide();

                    if (response.ok) {
                        Swal.fire('Success', 'Form submitted successfully!', 'success');
                    } else {
                        Swal.fire('Error', 'There was an error submitting the form.', 'error');
                    }
                } catch (error) {
                    Swal.fire('Error', `Submission failed: ${error}`, 'error');
                }
            });
        });
    </script>
</body>
</html>
