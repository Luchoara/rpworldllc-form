	<div id="messageBox">
		<p id="messageText" style="margin: 0"></p>
	</div>

	<script>
		$(document).ready(function () {
				const today = new Date().toISOString().split("T")[0];

				// Configuración de datetimepicker para el campo DOB
				$("#dob").datetimepicker({
						format: "Y-m-d",
						timepicker: false,
						maxDate: today,
				});

				// Mostrar u ocultar la sección de condiciones según el producto seleccionado
				$("#Product").on("change", function () {
						const productValue = $(this).val();
						if (productValue === "(MA) Medicare Advantage" || productValue === "(MS) Medicare Supplement") {
								$("#conditionsSection").slideDown();
						} else {
								$("#conditionsSection").slideUp();
						}
				});

				document
						.querySelector("#formData")
						.addEventListener("submit", async (event) => {
								event.preventDefault();

								const formData = new FormData(event.target);
								const data = Object.fromEntries(formData.entries());

								try {
										// Enviar datos a dynamic_proxy.php
										const response = await fetch(
												"https://rpworldllc.com/leadform/dynamic_proxy.php",
												{
														method: "POST",
														headers: { "Content-Type": "application/json" },
														body: JSON.stringify(data),
												}
										);

										if (response.ok) {
												const responseJson = await response.json();

												// *** Agregar log en consola para mostrar la respuesta de la API ***
												console.log("Respuesta de la API:", responseJson);

												// Extraer el valor de 'status' y 'Success' de la respuesta JSON
												const apiSuccess =
														responseJson.apiResponse &&
														(responseJson.apiResponse.Success === "true" ||
																responseJson.apiResponse.Success === true);

												const dbSuccess =
														responseJson.dbResponse &&
														responseJson.dbResponse.status === "success";

												// Determinar si la respuesta fue exitosa
												const overallSuccess =
														responseJson.status === "success" && apiSuccess && dbSuccess;

												if (overallSuccess) {
														// Mostrar mensaje de éxito en verde
														showMessage(
																`<ul>
																		<li><strong>Status:</strong> ${responseJson.status}</li>
																		<li><strong>Transaction ID:</strong> ${
																				responseJson.apiResponse.TransactionId || "N/A"
																		}</li>
																		<li><strong>Environment:</strong> ${
																				responseJson.apiResponse.Environment || "N/A"
																		}</li>
																		<li><strong>DB Message:</strong> ${responseJson.dbResponse.message}</li>
																</ul>`,
																"success"
														);
												} else {
														// Mostrar mensaje de error en rojo si algo falla
														showMessage(
																`<ul>
																		<li><strong>Status:</strong> ${responseJson.status}</li>
																		<li><strong>API Success:</strong> ${apiSuccess}</li>
																		<li><strong>DB Success:</strong> ${dbSuccess}</li>
																		<li><strong>Respuesta completa:</strong> ${JSON.stringify(
																				responseJson
																		)}</li>
																</ul>`,
																"error"
														);
												}
										} else {
												const errorText = await response.text();
												showMessage(`Error: ${errorText}`, "error");

												// *** Agregar log en consola para mostrar el error de la respuesta ***
												console.error("Error en la respuesta de la API:", errorText);
										}
								} catch (error) {
										showMessage(`Error: ${error.message}`, "error");

										// *** Agregar log en consola para mostrar el error capturado ***
										console.error("Error al procesar la solicitud:", error);
								}
						});

				function showMessage(message, type) {
						const messageBox = document.getElementById("messageBox");
						const messageText = document.getElementById("messageText");

						messageText.innerHTML = message;
						messageBox.style.backgroundColor =
								type === "success" ? "lightgreen" : "red";
						messageBox.style.display = "block";

						setTimeout(() => {
								messageBox.style.display = "none";
						}, 20000);
				}
		});
	
	</script>
